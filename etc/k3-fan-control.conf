# K3 Pico fan policy, sourced by /usr/local/lib/k3-fan-control/k3-fan-guard.
#
# FAN_MIN_STATE is the lowest pwm-fan cooling level the fan may drop to.
# Level 0 stops the fan; level 8 is the maximum. The default pins the fan at
# the maximum level, so the fan runs continuously and never stops.
FAN_MIN_STATE=8

# Seconds between re-assertions. The kernel step_wise governor is the only
# registered policy on this board and keeps moving the level with temperature,
# so the guard re-asserts the floor at this interval.
FAN_REASSERT_SECONDS=1
